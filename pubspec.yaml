name: hospital_management_app
description: A Flutter app for hospital management.

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.1.0
  flutter_bloc: ^8.1.1
  equatable: ^2.0.3
  image_picker: ^0.8.4+8
  geolocator: ^9.0.2
  http: ^0.13.6
  flutter_launcher_icons: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "asset/icon.png"

flutter:
  uses-material-design: true
  assets:
    - asset/icon.png

  
